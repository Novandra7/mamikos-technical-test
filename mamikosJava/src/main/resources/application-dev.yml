spring:
  flyway:
    # Demo accounts and sample kosts live in a profile-scoped migration folder
    # so they can never be applied to production by accident.
    locations: classpath:db/migration,classpath:db/migration/dev
  jpa:
    properties:
      hibernate:
        format_sql: true

